version: "3.8"

services:
  neo4j:
    image: neo4j:5.14
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/pjfa_password_change_me
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=pjfa_password_change_me
      - PJFA_OUTPUTS_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
      # Mount your local Hospital_log.xes here to run the pipeline inside the container:
      # - ./Hospital_log.xes:/app/Hospital_log.xes:ro
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
